# MSI PRO H610M-G WIFI (MS-7D46), Nuvoton NCT6687D at ISA 0xA20, driver nct6687 (nct6687d) in its DEFAULT mode
#
# The driver's default voltage labels assume an MSI AMD board. Intel 600-series MSI boards wire the
# registers differently (see third_party/nct6687d/sensors.d/Z690_PRO_A.conf). The mapping below follows
# that Z690 file, translated to the default-mode channel numbers, and was sanity-checked against
# readings on this machine on 2026-11-10:
#
#   channel  register  default label  real rail      raw    shown
#   in3      2         "CPU Soc"      CPU Vcore      1.326  1.33 V
#   in4      4         "CPU Vcore"    DRAM (×2)      0.560  1.12 V  (DDR5 nominal 1.1 V)
#   in7      3         "DRAM" (×2)    VIN3, unknown  1.344  (hidden)
#   in8      5         "Chipset"      CPU SA         0.788  0.79 V
#   in9      6         "CPU SA"       CPU AUX (×2)   0.898  1.80 V  (nominal 1.8 V)
#   in5,in6  9,10      1P8/VDDP       not connected  0      (hidden)
#
# Install:  sudo install -m644 msi-pro-h610m-g-7d46.conf /etc/sensors.d/
# Remove:   sudo rm /etc/sensors.d/msi-pro-h610m-g-7d46.conf

chip "nct6687-isa-0a20"
    label in0  "+12V"
    label in1  "+5V"
    label in2  "+3.3V"
    label in3  "CPU Vcore"
    label in4  "DRAM"
    label in8  "CPU SA"
    label in9  "CPU AUX"
    label in10 "VIN7"
    label in11 "AVCC3"
    label in12 "AVSB"
    label in13 "VBat (raw, scale unverified)"

    compute in4  (@ * 2), (@ / 2)
    compute in9  (@ * 2), (@ / 2)

    ignore in5
    ignore in6
    ignore in7

    label fan1 "CPU_FAN1"
    label fan3 "SYS_FAN1"
    # These headers don't exist on this board (only CPU_FAN1 + SYS_FAN1)
    ignore fan2
    ignore fan4
    ignore fan5
    ignore fan6
    ignore fan7
    ignore fan8

    label temp1 "CPU"
    label temp2 "System"
    label temp3 "VRM MOS"
    label temp4 "PCH"
    label temp5 "CPU Socket"
    label temp6 "PCIe x1"
    label temp7 "M2_1"
